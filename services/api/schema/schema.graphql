# Cumplify API Core — GraphQL Schema (M1–M5)
# Auth modes: @aws_lambda (user-facing, default), @aws_iam (agent/service)
# Per design §2.2: every user-facing operation annotated @aws_lambda;
# agent-path mutations annotated @aws_iam; subscriptions use None data source.
# SCHEMA-5: no tenantId in mutation inputs — resolvers overwrite from resolverContext.

# ─── Scalars & Enums ─────────────────────────────────────────────────────────

scalar AWSDateTime
scalar AWSJSON

enum Standard {
  ISO9001
  ISO14001
  ISO45001
}

enum DocumentStatus {
  DRAFT
  IN_REVIEW
  APPROVED
  OBSOLETE
}

enum DocumentType {
  MANUAL
  PROCEDURE
  WORK_INSTRUCTION
  POLICY
  SCOPE
}

enum NCType {
  NONCONFORMING_OUTPUT
  NC
  INCIDENT
}

enum NCSource {
  AUDIT
  INCIDENT
  COMPLAINT
  PROCESS
}

enum Severity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum CAPAStatus {
  OPEN
  IN_PROGRESS
  CLOSED
  VERIFIED
}

enum FindingType {
  MAJOR_NC
  MINOR_NC
  OBSERVATION
  OFI
}

enum ApprovalDecision {
  APPROVED
  REJECTED
  RETURNED
}

enum RiskCategory {
  QUALITY
  ENVIRONMENTAL
  OHS
  OPPORTUNITY
}

enum Disposition {
  REWORK
  SCRAP
  CONCESSION
  REGRADE
}

# ─── M1: Document Studio Types ────────────────────────────────────────────────

type Document @aws_lambda @aws_iam {
  id: ID!
  standard: Standard!
  docType: DocumentType!
  title: String!
  status: DocumentStatus!
  ownerId: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type DocumentVersion @aws_lambda @aws_iam {
  id: ID!
  documentId: ID!
  versionNo: Int!
  contentRef: String!
  changeSummary: String
  authorId: String!
  createdAt: AWSDateTime!
}

type DocumentApproval @aws_lambda @aws_iam {
  id: ID!
  documentVersionId: ID!
  approverId: String!
  decision: ApprovalDecision!
  approvedAt: AWSDateTime
  eSignatureRef: String
}

type Policy @aws_lambda @aws_iam {
  id: ID!
  standard: Standard!
  policyText: String!
  effectiveDate: AWSDateTime!
  approvedVersionId: ID
}

type ImsScope @aws_lambda @aws_iam {
  id: ID!
  scopeStatement: String!
  boundaries: String
  exclusions9001: String
  updatedAt: AWSDateTime!
}

type Diff @aws_lambda {
  additions: Int!
  deletions: Int!
  content: String!
}

# ─── M2: CAPA Types ──────────────────────────────────────────────────────────

type Nonconformity @aws_lambda @aws_iam {
  id: ID!
  standard: Standard!
  source: NCSource!
  ncType: NCType!
  description: String!
  clauseRef: String!
  severity: Severity!
  status: CAPAStatus!
  raisedBy: String!
  raisedAt: AWSDateTime!
}

type RootCauseAnalysis @aws_lambda @aws_iam {
  id: ID!
  ncId: ID!
  method: String!
  findings: String!
  rootCauseSummary: String!
}

type CorrectiveAction @aws_lambda @aws_iam {
  id: ID!
  ncId: ID!
  actionDesc: String!
  ownerId: String!
  dueDate: AWSDateTime!
  status: CAPAStatus!
  containmentFlag: Boolean!
}

type CapaEffectivenessCheck @aws_lambda @aws_iam {
  id: ID!
  correctiveActionId: ID!
  verificationMethod: String!
  verifiedBy: String!
  verifiedAt: AWSDateTime!
  effective: Boolean!
}

type NonconformingOutput @aws_lambda @aws_iam {
  id: ID!
  ncId: ID!
  disposition: Disposition!
  authorizedBy: String!
}

# ─── M3: Audit Studio Types ───────────────────────────────────────────────────

type AuditProgramme @aws_lambda @aws_iam {
  id: ID!
  standard: Standard!
  year: Int!
  frequencyPlan: String
  status: String!
}

type Audit @aws_lambda @aws_iam {
  id: ID!
  programmeId: ID!
  standard: Standard!
  scope: String!
  leadAuditorId: String!
  plannedDate: AWSDateTime!
  actualDate: AWSDateTime
  status: String!
}

type AuditChecklist @aws_lambda @aws_iam {
  id: ID!
  auditId: ID!
  clauseRef: String!
  question: String!
  expectedEvidence: String
}

type AuditFinding @aws_lambda @aws_iam {
  id: ID!
  auditId: ID!
  checklistId: ID
  findingType: FindingType!
  clauseRef: String!
  description: String!
  evidenceRef: String
