type ReadinessScore @aws_lambda @aws_iam {
  id: ID!
  standard: Standard!
  clauseRef: String!
  score: Float!
  assessedAt: AWSDateTime!
}

# ─── M4: Records Management Types ────────────────────────────────────────────

type Record @aws_lambda @aws_iam {
  id: ID!
  standard: Standard!
  recordType: String!
  sourceModule: String!
  retentionClass: String
  retainUntil: AWSDateTime
  s3ObjectRef: String
}

type RetentionPolicy @aws_lambda @aws_iam {
  id: ID!
  recordType: String!
  retentionYears: Int!
  dispositionRule: String!
}

type MeasuringResource @aws_lambda @aws_iam {
  id: ID!
